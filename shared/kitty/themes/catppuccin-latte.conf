# vim:ft=kitty

## name:     Catppuccin Latte (tuned for readability)
## upstream: https://github.com/catppuccin/kitty/blob/main/themes/latte.conf
##
## Light-theme ANSI layout (see ADDING-THEMES.md "Light themes"):
##   color0 = a surface just darker than the background (apps paint "black"
##            backgrounds with it, so it must stay light), color8 = dim text,
##   color7 = muted text, color15 = foreground ("white" text must be readable).
## Accent contrast and color16-255 are enforced/generated by ../build-palettes.ts.

background #eff1f5
foreground #4c4f69
# Keep each cell's own text color inside the selection; the tint is light
# enough that build-palettes.ts can keep every accent >= 3:1 on it.
selection_background #ccd0da
selection_foreground none

cursor #dc8a78
cursor_text_color #eff1f5
url_color #dc8a78

active_border_color #7287fd
inactive_border_color #9ca0b0
bell_border_color #df8e1d

wayland_titlebar_color system
macos_titlebar_color system

active_tab_foreground #eff1f5
active_tab_background #8839ef
inactive_tab_foreground #4c4f69
inactive_tab_background #9ca0b0
tab_bar_background #bcc0cc

mark1_foreground #eff1f5
mark1_background #7287fd
mark2_foreground #eff1f5
mark2_background #8839ef
mark3_foreground #eff1f5
mark3_background #209fb5

# Light palettes are drawn opaque: a translucent light background over a dark
# desktop turns grey and kills contrast. settheme applies this live.
background_opacity 1.0

# The 16 terminal colors
color0  #dce0e8
color8  #707384
color7  #5c5f77
color15 #4c4f69

